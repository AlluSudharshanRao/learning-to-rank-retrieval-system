[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ltr-system"
version = "0.1.0"
description = "Reproducible retrieval and ranking experiments on Slurm"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6"]

[project.scripts]
ltr-download-encoder = "ltr_system.commands:download_main"
ltr-check-gpu = "ltr_system.commands:gpu_main"
ltr-check-encoder = "ltr_system.commands:encoder_main"
ltr-check-faiss = "ltr_system.commands:faiss_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ltr_system = ["defaults/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
