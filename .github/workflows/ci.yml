name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/dev.txt
      - run: python -m pip install -e . faiss-cpu==1.15.1 -r requirements/dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: bash -n slurm/smoke.sbatch
      - run: python -m unittest discover -s tests -v
      - name: Check CLI without loading models
        run: |
          for script in scripts/*.py; do python -I "$script" --help; done
  pooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_encoding.py -v
